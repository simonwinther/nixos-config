general {
    lock_cmd = desktopctl lock                         # lock screen and 1password
    before_sleep_cmd = DESKTOP_LOCK_ONLY=true desktopctl lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && desktopctl wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Preserve the reference lock timeout (152 seconds).
listener {
    timeout = 152
    on-timeout = desktopctl lock
    on-resume = desktopctl wake
}
